# Tester Options
[tester]

# Solver Options
[tester.solver]

        # Configure optimization strategy
        #       %A: {bb|usc}[,<tactics>]
        #         bb : Model-guided optimization with <tactics {lin|hier|inc|dec}> [lin]
        #           lin : Basic lexicographical descent
        #           hier: Hierarchical (highest priority criteria first) descent
        #           inc : Hierarchical descent with exponentially increasing steps
        #           dec : Hierarchical descent with exponentially decreasing steps
        #         usc: Core-guided optimization with <tactics>: <relax>[,<opts>]
        #           <relax>: Relaxation algorithm {oll|one|k|pmres}                [oll]
        #             oll    : Use strategy from unclasp
        #             one    : Add one cardinality constraint per core
        #             k[,<n>]: Add cardinality constraints of bounded size ([0]=dynamic)
        #             pmres  : Add clauses of size 3
        #           <opts> : Tactics <list {disjoint|succinct|stratify}>|<mask {0..7}>
        #             disjoint: Disjoint-core preprocessing                    (1)
        #             succinct: No redundant (symmetry) constraints            (2)
        #             stratify: Stratification heuristic for handling weights  (4)
        tester.solver.opt_strategy = None

        # Enable core-shrinking in core-guided optimization
        #       %A: <algo>[,<limit> (0=no limit)]
        #         <algo> : Use algorithm {lin|inv|bin|rgs|exp|min}
        #           lin  : Forward linear search unsat
        #           inv  : Inverse linear search not unsat
        #           bin  : Binary search
        #           rgs  : Repeated geometric sequence until unsat
        #           exp  : Exponential search until unsat
        #           min  : Linear search for subset minimal core
        #         <limit>: Limit solve calls to 2^<n> conflicts [10]
        tester.solver.opt_usc_shrink = None

        # Enable optimization heuristic
        #       %A: {sign|model}
        #         sign : Prefer signs minimizing objective
        #         model: Assume literals minimizing objective after each model
        tester.solver.opt_heuristic = None

        # Restart after each model

        tester.solver.restart_on_model = None

        # Configure failed-literal detection (fld)
        #       %A: <type>[,<limit>] / Implicit: %I
        #         <type> : Run fld via {atom|body|hybrid} lookahead
        #         <limit>: Disable fld after <limit> applications ([0]=no limit)
        #       --lookahead=atom is default if --no-lookback is used

        tester.solver.lookahead = None

        # Configure decision heuristic
        #       %A: {Berkmin|Vmtf|Vsids|Domain|Unit|None}[,<n>]
        #         Berkmin: Use BerkMin-like heuristic (Check last <n> nogoods [0]=all)
        #         Vmtf   : Use Siege-like heuristic (Move <n> literals to the front [8])
        #         Vsids  : Use Chaff-like heuristic (Use 1.0/0.<n> as decay factor  [95])
        #         Domain : Use domain knowledge in Vsids-like heuristic
        #         Unit   : Use Smodels-like heuristic (Default if --no-lookback)
        #         None   : Select the first free variable
        tester.solver.heuristic = None

        # Initialize heuristic with MOMS-score
        tester.solver.init_moms = None

        # Resolution score {auto|min|set|multiset}
        tester.solver.score_res = None

        # Score other learnt nogoods: {auto|no|loop|all}
        tester.solver.score_other = None

        # Default sign: {asp|pos|neg|rnd}
        tester.solver.sign_def = None

        # Disable sign heuristics and use default signs only
        tester.solver.sign_fix = None

        # Enable Huang-scoring in Berkmin
        tester.solver.berk_huang = None

        # Enable acids-scheme in Vsids/Domain
        tester.solver.vsids_acids = None

        # Enable dynamic decaying scheme in Vsids/Domain
        #       %A: <n>[,<i {1..100}>][,<c>]|(0=disable)
        #         <n> : Set initial decay factor to 1.0/0.<n>
        #         <i> : Set decay update to <i>/100.0      [1]
        #         <c> : Decrease decay every <c> conflicts [5000]
        tester.solver.vsids_progress = None

        # Prefer negative antecedents of P in heuristic
        tester.solver.nant = None

        # Default modification for domain heuristic
        #       %A: (no|<mod>[,<pick>])
        #         <mod>  : Modifier {level|pos|true|neg|false|init|factor}
        #         <pick> : Apply <mod> to (all | <list {scc|hcc|disj|opt|show}>) atoms
        tester.solver.dom_mod = None

        # Use RSat-like progress saving on backjumps > %A
        tester.solver.save_progress = None

        # Watched literal initialization: {rnd|first|least}
        tester.solver.init_watches = None

        # Process messages on {propagate|conflict}
        tester.solver.update_mode = None

        # Use backward inference in acyc propagation
        tester.solver.acyc_prop = None

        # Set random number generator's seed to %A
        tester.solver.seed = None

        # Disable all lookback strategies

        tester.solver.no_lookback = None

        # Configure forgetting on (incremental) step
        #       %A: <list {varScores|signs|lemmaScores|lemmas}>|<mask {0..15}>

        tester.solver.forget_on_step = None

        # Use MiniSAT-like conflict nogood strengthening
        #       %A: <mode>[,<type>][,<bump {yes|no}>]
        #         <mode>: Use {local|recursive} self-subsumption check
        #         <type>: Follow {all|short|binary} antecedents [all]
        #         <bump>: Bump activities of antecedents        [yes]
        tester.solver.strengthen = None

        # Enable {1=partial|2=full} on-the-fly subsumption
        tester.solver.otfs = None

        # Configure LBD updates during conflict resolution
        #       %A: <mode {less|glucose|pseudo}>[,<n {0..127}>]
        #         less   : update to X = new LBD   iff X   < previous LBD
        #         glucose: update to X = new LBD   iff X+1 < previous LBD
        #         pseudo : update to X = new LBD+1 iff X   < previous LBD
        #            <n> : Protect updated nogoods on next reduce if X <= <n>
        tester.solver.update_lbd = None

        # Enable LBD-based activity bumping
        tester.solver.update_act = None

        # Enable ManySAT-like inverse-arc learning
        tester.solver.reverse_arcs = None

        # Configure handling of long learnt nogoods
        #       %A: <n>[,<rep>]
        #         <n>  : Contract nogoods if size > <n> (0=disable)
        #         <rep>: Nogood replacement {no|decisionSeq|allUIP|dynamic} [no]

        tester.solver.contraction = None

        # Configure learning of loop nogoods
        #       %A: {common|distinct|shared|no}
        #         common  : Create loop nogoods for atoms in an unfounded set
        #         distinct: Create distinct loop nogood for each atom in an unfounded set
        #         shared  : Create loop formula for a whole unfounded set
        #         no      : Do not learn loop formulas

        tester.solver.loops = None

        # Configure partial stability tests
        #       %A: <p>[,<h>] / Implicit: %I
        #         <p>: Partial check skip percentage
        #         <h>: Init/update value for high bound ([0]=umax)
        tester.solver.partial_check = None

        # Default sign for atoms in disjunctions
        tester.solver.sign_def_disj = None

        # Make random decisions with probability %A
        tester.solver.rand_freq = None

        # Do <n> random searches with [<m>=100] conflicts
        tester.solver.rand_prob = None

        # Configure restart policy
        #       %A: <type {F|L|x|+}>,<n {1..umax}>[,<args>][,<lim>]
        #         F,<n>    : Run fixed sequence of <n> conflicts
        #         L,<n>    : Run Luby et al.'s sequence with unit length <n>
        #         x,<n>,<f>: Run geometric seq. of <n>*(<f>^i) conflicts  (<f> >= 1.0)
        #         +,<n>,<m>: Run arithmetic seq. of <n>+(<m>*i) conflicts (<m {0..umax}>)
        #         ...,<lim>: Repeat sequence every <lim>+j restarts       (<type> != F)
        #       %A: D,<n>,<K>[,<args>]: Dynamic restarts based on moving LBD average
        #         <n>      : Fast moving average window size
        #         <K>      : Fast margin (restart if fastAvg * <K> > slowAvg)
        #         <L>      : LBD average limit                                [0 = none]
        #         <f>      : Fast moving average type                         [d = SMA]
        #           d      : Default
        #           e|l    : EMA with alpha = 2/(<n>+1) or 1/log2(<n>)
        #           es|ls  : e or l with exponentially decreasing alpha for first samples
        #         <k>      : keep fast moving average on (r)estarts/(b)locks  [n = never]
        #         <s>      : slow moving average type                         [d = CMA]
        #         <w>      : slow moving average window size (<s> != d)       [200*<n>]
        #       no|0       : Disable restarts
        tester.solver.restarts = None

        # Update restart seq. on model {no|repeat|disable}
        tester.solver.reset_restarts = None

        # Use Ryvchin et al.'s local restarts
        tester.solver.local_restarts = None

        # Use counter implication restarts
        #       %A: (<rate>[,<bump>] | {0|no})
        #       <rate>: Interval in number of restarts
        #       <bump>: Bump factor applied to indegrees
        tester.solver.counter_restarts = None

        # Use glucose-style blocking restarts
        #       %A: <n>[,<R {1.0..5.0}>][,<c>][,<a>]
        #         <n>: Window size for moving average (0=disable blocking)
        #         <R>: Block restart if assignment > average * <R>  [1.4]
        #         <c>: Disable blocking for the first <c> conflicts [10000]
        #         <a>: Type of moving average (see restarts)        [e]

        tester.solver.block_restarts = None

        # Shuffle problem after <n1>+(<n2>*i) restarts

        tester.solver.shuffle = None

        # Configure deletion algorithm [%D]
        #       %A: <algo>[,<n {1..100}>][,<sc>]
        #         <algo>: Use {basic|sort|ipSort|ipHeap} algorithm
        #         <n>   : Delete at most <n>%% of nogoods on reduction    [75]
        #         <sc>  : Use {activity|lbd|mixed} nogood scores    [activity]
        #       no      : Disable nogood deletion
        tester.solver.deletion = None

        # Configure size-based deletion policy
        #       %A: <f>[,<g>][,<sched>] (<f> >= 1.0)
        #         <f>     : Keep at most T = X*(<f>^i) learnt nogoods with X being the
        #                   initial limit and i the number of times <sched> fired
        #         <g>     : Stop growth once T > P*<g> (0=no limit)      [3.0]
        #         <sched> : Set grow schedule (<type {F|L|x|+}>) [grow on restart]
        tester.solver.del_grow = None

        # Configure conflict-based deletion policy
        #       %A:   <type {F|L|x|+}>,<args>... (see restarts)
        tester.solver.del_cfl = None

        # Configure initial deletion limit
        #       %A: <f>[,<n>,<o>] (<f> > 0)
        #         <f>    : Set initial limit to P=estimated problem size/<f> [%D]
        #         <n>,<o>: Clamp initial limit to the range [<n>,<n>+<o>]
        tester.solver.del_init = None

        # Use estimated problem complexity in limits
        tester.solver.del_estimate = None

        # Keep at most <n> learnt nogoods taking up to <X> MB
        tester.solver.del_max = None

        # Configure glue clause handling
        #       %A: <n {0..15}>[,<m {0|1}>]
        #         <n>: Do not delete nogoods with LBD <= <n>
        #         <m>: Count (0) or ignore (1) glue clauses in size limit [0]
        tester.solver.del_glue = None

        # Delete %A%% of learnt nogoods on each restart
        tester.solver.del_on_restart = None

        # Initializes this configuration
        #       <arg>: {auto|frumpy|jumpy|tweety|handy|crafty|trendy|many|<file>}
        #         auto  : Select configuration based on problem type
        #         frumpy: Use conservative defaults
        #         jumpy : Use aggressive defaults
        #         tweety: Use defaults geared towards asp problems
        #         handy : Use defaults geared towards large problems
        #         crafty: Use defaults geared towards crafted problems
        #         trendy: Use defaults geared towards industrial problems
        #         many  : Use default portfolio to configure solver(s)
        #         <file>: Use configuration file to configure solver(s)
        tester.configuration = None

        # Configure physical sharing of constraints [%D]
        #       %A: {auto|problem|learnt|all}
        tester.share = None

        # Do not use Short Implication Graph for learning
        tester.learn_explicit = None

        # Run SatELite-like preprocessing (Implicit: %I)
        #       %A: <level>[,<limit>...]
        #         <level> : Set preprocessing level to <level  {1..3}>
        #           1: Variable elimination with subsumption (VE)
        #           2: VE with limited blocked clause elimination (BCE)
        #           3: Full BCE followed by VE
        #         <limit> : [<key {iter|occ|time|frozen|clause}>=]<n> (0=no limit)
        #           iter  : Set iteration limit to <n>           [0]
        #           occ   : Set variable occurrence limit to <n> [0]
        #           time  : Set time limit to <n> seconds        [0]
        #           frozen: Set frozen variables limit to <n>%%   [0]
        #           size  : Set size limit to <n>*1000 clauses   [4000]
        tester.sat_prepro = None

# Solve Options
[solve]

        # Stop search after <n> conflicts or <m> restarts

        solve.solve_limit = 'umax,umax'

        # Run parallel search with given number of threads
        #       %A: <n {1..64}>[,<mode {compete|split}>]
        #         <n>   : Number of threads to use in search
        #         <mode>: Run competition or splitting based search [compete]

        solve.parallel_mode = '1,compete'

        # Configure global restart policy
        #       %A: <n>[,<sched>]
        #         <n> : Maximal number of global restarts (0=disable)
        #      <sched>: Restart schedule [x,100,1.5] (<type {F|L|x|+}>)

        solve.global_restarts = 'no'

        # Configure nogood distribution [%D]
        #       %A: <type>[,<mode>][,<lbd {0..127}>][,<size>]
        #         <type> : Distribute {all|short|conflict|loop} nogoods
        #         <mode> : Use {global|local} distribution   [global]
        #         <lbd>  : Distribute only if LBD  <= <lbd>  [4]
        #         <size> : Distribute only if size <= <size> [-1]
        solve.distribute = 'conflict,global,4,4194303'

        # Configure nogood integration [%D]
        #       %A: <pick>[,<n>][,<topo>]
        #         <pick>: Add {all|unsat|gp(unsat wrt guiding path)|active} nogoods
        #         <n>   : Always keep at least last <n> integrated nogoods   [1024]
        #         <topo>: Accept nogoods from {all|ring|cube|cubex} peers    [all]

        solve.integrate = 'gp,1024,all'

        # Configure enumeration algorithm [%D]
        #       %A: {bt|record|brave|cautious|auto}
        #         bt      : Backtrack decision literals from solutions
        #         record  : Add nogoods for computed solutions
        #         domRec  : Add nogoods over true domain atoms
        #         brave   : Compute brave consequences (union of models)
        #         cautious: Compute cautious consequences (intersection of models)
        #         auto    : Use bt for enumeration and record for optimization
        solve.enum_mode = 'auto'

        # Enable projective solution enumeration
        #       %A: {show|project|auto}[,<bt {0..3}>] (Implicit: %I)
        #         Project to atoms in show or project directives, or
        #         select depending on the existence of a project directive
        #       <bt> : Additional options for enumeration algorithm 'bt'
        #         Use activity heuristic (1) when selecting backtracking literal
        #         and/or progress saving (2) when retracting solution literals
        solve.project = 'no'

        # Compute at most %A models (0 for all)

        solve.models = '-1'

        # Configure optimization algorithm
        #       %A: <mode {opt|enum|optN|ignore}>[,<bound>...]
        #         opt   : Find optimal model
        #         enum  : Find models with costs <= <bound>
        #         optN  : Find optimum, then enumerate optimal models
        #         ignore: Ignore optimize statements
        #       <bound> : Set initial bound for objective function(s)
        solve.opt_mode = 'opt'

        # Stop optimization on model with cost <= <bound>

        solve.opt_stop = 'no'

# Asp Options
[asp]

        # Configure handling of extended rules
        #       %A: {all|choice|card|weight|integ|dynamic}
        #         all    : Transform all extended rules to basic rules
        #         choice : Transform choice rules, but keep cardinality and weight rules
        #         card   : Transform cardinality rules, but keep choice and weight rules
        #         weight : Transform cardinality and weight rules, but keep choice rules
        #         scc    : Transform "recursive" cardinality and weight rules
        #         integ  : Transform cardinality integrity constraints
        #         dynamic: Transform "simple" extended rules, but keep more complex ones
        asp.trans_ext = 'dynamic'

        # Configure equivalence preprocessing
        #       Run for at most %A iterations (-1=run to fixpoint)
        asp.eq = '3'

        # Use backpropagation in ASP-preprocessing
        asp.backprop = '0'

        # Compute supported models
        asp.supp_models = '0'

        # Disable unfounded set check
        asp.no_ufs_check = '0'

        # Do not add gamma rules for non-hcf disjunctions
        asp.no_gamma = '0'

        # Enable df-order in eq-preprocessing
        asp.eq_dfs = '0'

        # Enable old mapping for disjunctive LPs
        asp.dlp_old_map = '0'

# Solver Options
[solver]

        # Configure optimization strategy
        #       %A: {bb|usc}[,<tactics>]
        #         bb : Model-guided optimization with <tactics {lin|hier|inc|dec}> [lin]
        #           lin : Basic lexicographical descent
        #           hier: Hierarchical (highest priority criteria first) descent
        #           inc : Hierarchical descent with exponentially increasing steps
        #           dec : Hierarchical descent with exponentially decreasing steps
        #         usc: Core-guided optimization with <tactics>: <relax>[,<opts>]
        #           <relax>: Relaxation algorithm {oll|one|k|pmres}                [oll]
        #             oll    : Use strategy from unclasp
        #             one    : Add one cardinality constraint per core
        #             k[,<n>]: Add cardinality constraints of bounded size ([0]=dynamic)
        #             pmres  : Add clauses of size 3
        #           <opts> : Tactics <list {disjoint|succinct|stratify}>|<mask {0..7}>
        #             disjoint: Disjoint-core preprocessing                    (1)
        #             succinct: No redundant (symmetry) constraints            (2)
        #             stratify: Stratification heuristic for handling weights  (4)
        solver.opt_strategy = 'bb,lin'

        # Enable core-shrinking in core-guided optimization
        #       %A: <algo>[,<limit> (0=no limit)]
        #         <algo> : Use algorithm {lin|inv|bin|rgs|exp|min}
        #           lin  : Forward linear search unsat
        #           inv  : Inverse linear search not unsat
        #           bin  : Binary search
        #           rgs  : Repeated geometric sequence until unsat
        #           exp  : Exponential search until unsat
        #           min  : Linear search for subset minimal core
        #         <limit>: Limit solve calls to 2^<n> conflicts [10]
        solver.opt_usc_shrink = 'no'

        # Enable optimization heuristic
        #       %A: {sign|model}
        #         sign : Prefer signs minimizing objective
        #         model: Assume literals minimizing objective after each model
        solver.opt_heuristic = 'no'

        # Restart after each model

        solver.restart_on_model = '0'

        # Configure failed-literal detection (fld)
        #       %A: <type>[,<limit>] / Implicit: %I
        #         <type> : Run fld via {atom|body|hybrid} lookahead
        #         <limit>: Disable fld after <limit> applications ([0]=no limit)
        #       --lookahead=atom is default if --no-lookback is used

        solver.lookahead = 'no'

        # Configure decision heuristic
        #       %A: {Berkmin|Vmtf|Vsids|Domain|Unit|None}[,<n>]
        #         Berkmin: Use BerkMin-like heuristic (Check last <n> nogoods [0]=all)
        #         Vmtf   : Use Siege-like heuristic (Move <n> literals to the front [8])
        #         Vsids  : Use Chaff-like heuristic (Use 1.0/0.<n> as decay factor  [95])
        #         Domain : Use domain knowledge in Vsids-like heuristic
        #         Unit   : Use Smodels-like heuristic (Default if --no-lookback)
        #         None   : Select the first free variable
        solver.heuristic = 'vsids,92'

        # Initialize heuristic with MOMS-score
        solver.init_moms = '1'

        # Resolution score {auto|min|set|multiset}
        solver.score_res = 'auto'

        # Score other learnt nogoods: {auto|no|loop|all}
        solver.score_other = 'all'

        # Default sign: {asp|pos|neg|rnd}
        solver.sign_def = 'asp'

        # Disable sign heuristics and use default signs only
        solver.sign_fix = '0'

        # Enable Huang-scoring in Berkmin
        solver.berk_huang = '0'

        # Enable acids-scheme in Vsids/Domain
        solver.vsids_acids = '0'

        # Enable dynamic decaying scheme in Vsids/Domain
        #       %A: <n>[,<i {1..100}>][,<c>]|(0=disable)
        #         <n> : Set initial decay factor to 1.0/0.<n>
        #         <i> : Set decay update to <i>/100.0      [1]
        #         <c> : Decrease decay every <c> conflicts [5000]
        solver.vsids_progress = 'no'

        # Prefer negative antecedents of P in heuristic
        solver.nant = '0'

        # Default modification for domain heuristic
        #       %A: (no|<mod>[,<pick>])
        #         <mod>  : Modifier {level|pos|true|neg|false|init|factor}
        #         <pick> : Apply <mod> to (all | <list {scc|hcc|disj|opt|show}>) atoms
        solver.dom_mod = 'no'

        # Use RSat-like progress saving on backjumps > %A
        solver.save_progress = '160'

        # Watched literal initialization: {rnd|first|least}
        solver.init_watches = 'least'

        # Process messages on {propagate|conflict}
        solver.update_mode = 'propagate'

        # Use backward inference in acyc propagation
        solver.acyc_prop = '1'

        # Set random number generator's seed to %A
        solver.seed = '1'

        # Disable all lookback strategies

        solver.no_lookback = 'false'

        # Configure forgetting on (incremental) step
        #       %A: <list {varScores|signs|lemmaScores|lemmas}>|<mask {0..15}>

        solver.forget_on_step = 'no'

        # Use MiniSAT-like conflict nogood strengthening
        #       %A: <mode>[,<type>][,<bump {yes|no}>]
        #         <mode>: Use {local|recursive} self-subsumption check
        #         <type>: Follow {all|short|binary} antecedents [all]
        #         <bump>: Bump activities of antecedents        [yes]
        solver.strengthen = 'recursive,all,yes'

        # Enable {1=partial|2=full} on-the-fly subsumption
        solver.otfs = '2'

        # Configure LBD updates during conflict resolution
        #       %A: <mode {less|glucose|pseudo}>[,<n {0..127}>]
        #         less   : update to X = new LBD   iff X   < previous LBD
        #         glucose: update to X = new LBD   iff X+1 < previous LBD
        #         pseudo : update to X = new LBD+1 iff X   < previous LBD
        #            <n> : Protect updated nogoods on next reduce if X <= <n>
        solver.update_lbd = 'less,0'

        # Enable LBD-based activity bumping
        solver.update_act = '0'

        # Enable ManySAT-like inverse-arc learning
        solver.reverse_arcs = '0'

        # Configure handling of long learnt nogoods
        #       %A: <n>[,<rep>]
        #         <n>  : Contract nogoods if size > <n> (0=disable)
        #         <rep>: Nogood replacement {no|decisionSeq|allUIP|dynamic} [no]

        solver.contraction = 'no'

        # Configure learning of loop nogoods
        #       %A: {common|distinct|shared|no}
        #         common  : Create loop nogoods for atoms in an unfounded set
        #         distinct: Create distinct loop nogood for each atom in an unfounded set
        #         shared  : Create loop formula for a whole unfounded set
        #         no      : Do not learn loop formulas

        solver.loops = 'shared'

        # Configure partial stability tests
        #       %A: <p>[,<h>] / Implicit: %I
        #         <p>: Partial check skip percentage
        #         <h>: Init/update value for high bound ([0]=umax)
        solver.partial_check = 'no'

        # Default sign for atoms in disjunctions
        solver.sign_def_disj = 'asp'

        # Make random decisions with probability %A
        solver.rand_freq = '0'

        # Do <n> random searches with [<m>=100] conflicts
        solver.rand_prob = 'no'

        # Configure restart policy
        #       %A: <type {F|L|x|+}>,<n {1..umax}>[,<args>][,<lim>]
        #         F,<n>    : Run fixed sequence of <n> conflicts
        #         L,<n>    : Run Luby et al.'s sequence with unit length <n>
        #         x,<n>,<f>: Run geometric seq. of <n>*(<f>^i) conflicts  (<f> >= 1.0)
        #         +,<n>,<m>: Run arithmetic seq. of <n>+(<m>*i) conflicts (<m {0..umax}>)
        #         ...,<lim>: Repeat sequence every <lim>+j restarts       (<type> != F)
        #       %A: D,<n>,<K>[,<args>]: Dynamic restarts based on moving LBD average
        #         <n>      : Fast moving average window size
        #         <K>      : Fast margin (restart if fastAvg * <K> > slowAvg)
        #         <L>      : LBD average limit                                [0 = none]
        #         <f>      : Fast moving average type                         [d = SMA]
        #           d      : Default
        #           e|l    : EMA with alpha = 2/(<n>+1) or 1/log2(<n>)
        #           es|ls  : e or l with exponentially decreasing alpha for first samples
        #         <k>      : keep fast moving average on (r)estarts/(b)locks  [n = never]
        #         <s>      : slow moving average type                         [d = CMA]
        #         <w>      : slow moving average window size (<s> != d)       [200*<n>]
        #       no|0       : Disable restarts
        solver.restarts = 'l,60'

        # Update restart seq. on model {no|repeat|disable}
        solver.reset_restarts = 'no'

        # Use Ryvchin et al.'s local restarts
        solver.local_restarts = '1'

        # Use counter implication restarts
        #       %A: (<rate>[,<bump>] | {0|no})
        #       <rate>: Interval in number of restarts
        #       <bump>: Bump factor applied to indegrees
        solver.counter_restarts = 'no'

        # Use glucose-style blocking restarts
        #       %A: <n>[,<R {1.0..5.0}>][,<c>][,<a>]
        #         <n>: Window size for moving average (0=disable blocking)
        #         <R>: Block restart if assignment > average * <R>  [1.4]
        #         <c>: Disable blocking for the first <c> conflicts [10000]
        #         <a>: Type of moving average (see restarts)        [e]

        solver.block_restarts = 'no'

        # Shuffle problem after <n1>+(<n2>*i) restarts

        solver.shuffle = 'no'

        # Configure deletion algorithm [%D]
        #       %A: <algo>[,<n {1..100}>][,<sc>]
        #         <algo>: Use {basic|sort|ipSort|ipHeap} algorithm
        #         <n>   : Delete at most <n>%% of nogoods on reduction    [75]
        #         <sc>  : Use {activity|lbd|mixed} nogood scores    [activity]
        #       no      : Disable nogood deletion
        solver.deletion = 'basic,50,activity'

        # Configure size-based deletion policy
        #       %A: <f>[,<g>][,<sched>] (<f> >= 1.0)
        #         <f>     : Keep at most T = X*(<f>^i) learnt nogoods with X being the
        #                   initial limit and i the number of times <sched> fired
        #         <g>     : Stop growth once T > P*<g> (0=no limit)      [3.0]
        #         <sched> : Set grow schedule (<type {F|L|x|+}>) [grow on restart]
        solver.del_grow = 'no'

        # Configure conflict-based deletion policy
        #       %A:   <type {F|L|x|+}>,<args>... (see restarts)
        solver.del_cfl = '+,2000,100,20'

        # Configure initial deletion limit
        #       %A: <f>[,<n>,<o>] (<f> > 0)
        #         <f>    : Set initial limit to P=estimated problem size/<f> [%D]
        #         <n>,<o>: Clamp initial limit to the range [<n>,<n>+<o>]
        solver.del_init = '3,10,4294967285'

        # Use estimated problem complexity in limits
        solver.del_estimate = '1'

        # Keep at most <n> learnt nogoods taking up to <X> MB
        solver.del_max = '2000000,0'

        # Configure glue clause handling
        #       %A: <n {0..15}>[,<m {0|1}>]
        #         <n>: Do not delete nogoods with LBD <= <n>
        #         <m>: Count (0) or ignore (1) glue clauses in size limit [0]
        solver.del_glue = '2,0'

        # Delete %A%% of learnt nogoods on each restart
        solver.del_on_restart = '0'

        # Initializes this configuration
        #       <arg>: {auto|frumpy|jumpy|tweety|handy|crafty|trendy|many|<file>}
        #         auto  : Select configuration based on problem type
        #         frumpy: Use conservative defaults
        #         jumpy : Use aggressive defaults
        #         tweety: Use defaults geared towards asp problems
        #         handy : Use defaults geared towards large problems
        #         crafty: Use defaults geared towards crafted problems
        #         trendy: Use defaults geared towards industrial problems
        #         many  : Use default portfolio to configure solver(s)
        #         <file>: Use configuration file to configure solver(s)
        configuration = 'auto'

        # Configure physical sharing of constraints [%D]
        #       %A: {auto|problem|learnt|all}
        share = 'auto'

        # Do not use Short Implication Graph for learning
        learn_explicit = '0'

        # Run SatELite-like preprocessing (Implicit: %I)
        #       %A: <level>[,<limit>...]
        #         <level> : Set preprocessing level to <level  {1..3}>
        #           1: Variable elimination with subsumption (VE)
        #           2: VE with limited blocked clause elimination (BCE)
        #           3: Full BCE followed by VE
        #         <limit> : [<key {iter|occ|time|frozen|clause}>=]<n> (0=no limit)
        #           iter  : Set iteration limit to <n>           [0]
        #           occ   : Set variable occurrence limit to <n> [0]
        #           time  : Set time limit to <n> seconds        [0]
        #           frozen: Set frozen variables limit to <n>%%   [0]
        #           size  : Set size limit to <n>*1000 clauses   [4000]
        sat_prepro = 'no'

        # Enable {1=basic|2=full} statistics (<t> for tester)
        stats = '0'

        # Enable extensions in non-aspif input
        parse_ext = 'false'

        # Treat dimacs input as MaxSAT problem
        parse_maxsat = 'false'
